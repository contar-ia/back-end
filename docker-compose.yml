services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

    entrypoint: /bin/sh
    command:
      - "-c"
      - "ollama serve & sleep 5 && ollama pull llama3.2:latest && wait"

    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  contaria_db:
    build:
      context: ./app/database
      dockerfile: Dockerfile
    container_name: contaria_db
    restart: unless-stopped
    volumes:
      - contaria_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contaria -d contaria"]
      interval: 5s
      timeout: 5s
      retries: 10

  fastapi-app:
    build: .
    container_name: fastapi-app
    restart: unless-stopped
    ports:
      - "8000:8000"

    environment:
      OLLAMA_API_URL: "http://ollama:11434/api/generate"
      OLLAMA_MODEL: "llama3.2:latest"
      DATABASE_URL: "postgresql://contaria:contaria@contaria_db:5432/contaria"

    depends_on:
      ollama:
        condition: service_healthy
      contaria_db:
        condition: service_healthy

    volumes:
      - .:/app

volumes:
  ollama_data:
  contaria_db_data: